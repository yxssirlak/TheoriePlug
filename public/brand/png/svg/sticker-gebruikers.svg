<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
<feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
<feOffset dx="0" dy="10" result="b"/>
<feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<g filter="url(#sh)">
<g transform="translate(0 0) rotate(-2 300 300)">
<g id="rand">
<rect x="75" y="135" width="450" height="320" rx="56" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
</g>
<g id="sticker">
